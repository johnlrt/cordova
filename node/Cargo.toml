[package]
name = "cordova-node"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cordova community inference node"

[[bin]]
name = "cordova-node"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
clap = { version = "=4.6.1", features = ["derive", "env"] }
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
hmac = "=0.13.0"
fs2 = "=0.4.3"
keyring = "=3.6.3"
rand = "=0.9.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.11.0"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "net", "io-util", "fs"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process"] }
