services:
  redis:
    # Keep the M1/dev Redis AOF on the writable tmpfs. The production compose
    # file keeps its persistent /data volume and its durability settings.
    command: [sh, -c, "exec redis-server --dir /tmp --appendonly yes --appendfsync everysec --requirepass \"$$(cat /run/secrets/redis_password)\""]

  redpanda:
    # In the isolated single-node dev stack, wait for Kafka metadata requests
    # to work. Full cluster-health reports can remain in `starting` in dev mode.
    healthcheck:
      test: [CMD, rpk, cluster, info, -X, brokers=redpanda:9092]

  gateway:
    environment:
      CORDOVA_ENV: development
      CORDOVA_PUBLIC_ORIGIN: https://localhost:8443

  edge:
    # The official nginx entrypoint chowns its writable tmpfs cache directories.
    cap_add: [CHOWN]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
