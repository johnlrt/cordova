name: cordova-m1

services:
  gateway:
    image: cordova-gateway:0.1.0
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
      target: gateway
    command: ["-listen", ":8080"]
    environment:
      CORDOVA_M1_MODE: "true"
      CORDOVA_ENV: development
      CORDOVA_PUBLIC_ORIGIN: https://localhost:8443
      CORDOVA_PRIVACY_NOTICE_VERSION: privacy-v1
      CORDOVA_REDIS_URL: redis://redis:6379/0
      CORDOVA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CORDOVA_KAFKA_BROKERS: kafka:9092
      CORDOVA_KAFKA_SASL_USERNAME: cordova_gateway
      CORDOVA_KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_app_password
      CORDOVA_MOCK_NODE_URL: wss://mock-node:8090/ws
      CORDOVA_MOCK_NODE_TOKEN_FILE: /run/secrets/mock_node_token
      CORDOVA_MOCK_NODE_CA_FILE: /run/secrets/dev_ca
      CORDOVA_APP_PEPPER_FILE: /run/secrets/app_pepper
      CORDOVA_TRUST_PROXY: "true"
    secrets:
      - app_pepper
      - redis_password
      - mock_node_token
      - kafka_app_password
      - source: dev_ca
        target: dev_ca
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      usage-topic-init:
        condition: service_completed_successfully
      mock-node:
        condition: service_healthy
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/readyz | grep -q 'ready'"]
      interval: 10s
      timeout: 4s
      retries: 8

  mock-node:
    image: cordova-mock-node:0.1.0
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
      target: mock-node
    environment:
      CORDOVA_MOCK_NODE_TOKEN_FILE: /run/secrets/mock_node_token
      CORDOVA_MOCK_NODE_TLS_CERT: /run/secrets/mock_node_cert
      CORDOVA_MOCK_NODE_TLS_KEY: /run/secrets/mock_node_key
      CORDOVA_MOCK_NODE_LISTEN: :8090
    secrets:
      - mock_node_token
      - source: mock_node_cert
        target: mock_node_cert
      - source: mock_node_key
        target: mock_node_key
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -qO- https://127.0.0.1:8090/healthz >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 8

  redis:
    image: redis:7.4.2-alpine3.21
    command:
      - sh
      - -c
      - |
        set -eu
        password="$$(cat /run/secrets/redis_password)"
        find /data ! -user redis -exec chown redis:redis '{}' +
        umask 077
        printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' "$$password" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec gosu redis redis-server /tmp/redis.conf
    secrets: [redis_password]
    volumes: [redis-data:/data]
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_OPTS: -Djava.security.auth.login.config=/run/secrets/kafka_server_jaas
    secrets:
      - source: kafka_server_jaas
        target: kafka_server_jaas
      - source: kafka_admin_properties
        target: kafka_admin_properties
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [private]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties >/dev/null 2>&1]
      interval: 10s
      timeout: 5s
      retries: 20

  usage-topic-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --describe --topic cordova.account.usage.v1 >/dev/null 2>&1 ||
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --create --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --topic cordova.account.usage.v1;
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --add --allow-principal User:cordova_gateway --operation Write --operation Describe --topic cordova.account.usage.v1;
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --add --allow-principal User:cordova_gateway --operation IdempotentWrite --cluster;
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --add --allow-principal User:cordova_gateway --operation Read --operation Describe --topic cordova.account.usage.v1;
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_admin_properties --add --allow-principal User:cordova_gateway --operation Read --operation Describe --group cordova-usage-projection-v1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [private]
    secrets:
      - source: kafka_admin_properties
        target: kafka_admin_properties
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m

  edge:
    image: cordova-edge:0.1.0
    build:
      context: ..
      dockerfile: infra/edge.Dockerfile
    ports:
      - 127.0.0.1:8443:8443
    secrets:
      - source: edge_cert
        target: edge_cert
      - source: edge_key
        target: edge_key
    depends_on:
      gateway:
        condition: service_healthy
    networks: [front, private]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz | grep -q 'm1'"]
      interval: 10s
      timeout: 4s
      retries: 8

networks:
  front: {}
  private:
    internal: true

volumes:
  redis-data:
  kafka-data:

secrets:
  app_pepper:
    file: ../.local/app-pepper
  redis_password:
    file: ../.local/redis-password
  mock_node_token:
    file: ../.local/mock-node-token
  dev_ca:
    file: ../.local/dev-ca.crt
  edge_cert:
    file: ../.local/edge.crt
  edge_key:
    file: ../.local/edge.key
  mock_node_cert:
    file: ../.local/mock-node.crt
  mock_node_key:
    file: ../.local/mock-node.key
  kafka_app_password:
    file: ../.local/kafka-app-password
  kafka_admin_properties:
    file: ../.local/kafka-admin.properties
  kafka_server_jaas:
    file: ../.local/kafka-server-jaas.conf
