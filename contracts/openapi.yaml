{
  "openapi": "3.1.0",
  "info": {
    "title": "Cordova public API",
    "version": "1.0.0",
    "description": "Implemented M1 mock-node slice with metadata-only ledger status and balance reads. Chat usage remains synthetic and test credits only; no real model inference, deposits or payouts are active."
  },
  "paths": {
    "/healthz": {
      "get": {
        "operationId": "health",
        "summary": "Check gateway liveness",
        "security": [],
        "responses": {
          "200": {
            "description": "The process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/v1/models": {
      "get": {
        "operationId": "listModels",
        "summary": "List the demo model catalog",
        "security": [
          {
            "BearerAuth": []
          },
          {
            "SessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "One mock model is available.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/v1/chat/completions": {
      "post": {
        "operationId": "createChatCompletion",
        "summary": "Create a zero-priced M1 mock chat completion",
        "description": "M1 routes this request through the private WSS mock node and the M3 coordinator. The configured tokenizer and price are synthetic/zero-priced test values; usage is not a real token count or billable quantity. Real tokenization, signed C3 node sessions, and C6 capacity routing are not admitted yet.",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/RequestId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ChatCompletionRequest"
              },
              "examples": {
                "buffered": {
                  "value": {
                    "model": "cordova-chat-small-v1",
                    "messages": [
                      {
                        "role": "user",
                        "content": "Hello"
                      }
                    ]
                  }
                },
                "streaming": {
                  "value": {
                    "model": "cordova-chat-small-v1",
                    "messages": [
                      {
                        "role": "user",
                        "content": "Hello"
                      }
                    ],
                    "stream": true,
                    "stream_options": {
                      "include_usage": true
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A completion or a server-sent event stream.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatCompletion"
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "description": "OpenAI-style data events ending in data: [DONE] on success. An error after streaming starts closes the stream without a success terminator."
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestId"
              },
              "X-Cordova-Mode": {
                "schema": {
                  "type": "string",
                  "const": "mock"
                }
              },
              "X-Cordova-Usage": {
                "schema": {
                  "type": "string",
                  "const": "synthetic-word-counts-not-billable"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "409": {
            "description": "The idempotency key is in progress, was reused with a different body, or has already completed. The original request ID is included when known.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/ModelNotFound"
          },
          "429": {
            "$ref": "#/components/responses/Busy"
          },
          "503": {
            "$ref": "#/components/responses/ExecutorUnavailable"
          }
        }
      }
    },
