{
  "openapi": "3.1.0",
  "info": {
    "title": "Cordova public API",
    "version": "0.3.0",
    "description": "Contract-first public API for the current gateway. Stage-2 account, node, and billing operations remain planned in PLAN.md."
  },
  "paths": {
    "/healthz": {
      "get": {
        "operationId": "health",
        "summary": "Check gateway liveness",
        "security": [],
        "responses": {
          "200": {
            "description": "The process is alive.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Health"}
              }
            }
          }
        }
      }
    },
    "/v1/models": {
      "get": {
        "operationId": "listModels",
        "summary": "List the demo model catalog",
        "security": [{"BearerAuth": []}],
        "responses": {
          "200": {
            "description": "One mock model is available.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ModelList"}
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"}
        }
      }
    },
    "/v1/chat/completions": {
      "post": {
        "operationId": "createChatCompletion",
        "summary": "Create a synthetic stage-1 chat completion",
        "description": "This operation currently uses inference.Mock. C2 generation controls are validated and passed to the provider boundary; the mock does not apply sampling or stop behavior. Usage values are synthetic word counts and are not tokens or billable quantities.",
        "security": [{"BearerAuth": []}],
        "parameters": [
          {"$ref": "#/components/parameters/RequestId"},
          {"$ref": "#/components/parameters/IdempotencyKeyRejected"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/ChatCompletionRequest"},
              "examples": {
                "buffered": {
                  "value": {
                    "model": "cordova-chat-small-v1",
                    "messages": [{"role": "user", "content": "Hello"}]
                  }
                },
                "streaming": {
                  "value": {
                    "model": "cordova-chat-small-v1",
                    "messages": [{"role": "user", "content": "Hello"}],
                    "stream": true,
                    "stream_options": {"include_usage": true}
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A completion or a server-sent event stream.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ChatCompletion"}
              },
              "text/event-stream": {
                "schema": {"type": "string"},
                "description": "OpenAI-style data events ending in data: [DONE] on success. An error after streaming starts closes the stream without a success terminator."
              }
            },
            "headers": {
              "X-Request-ID": {"$ref": "#/components/headers/RequestId"},
              "X-Cordova-Mode": {"schema": {"type": "string", "const": "mock"}},
              "X-Cordova-Usage": {"schema": {"type": "string", "const": "synthetic-word-counts-not-billable"}}
            }
          },
          "400": {"$ref": "#/components/responses/InvalidRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/ModelNotFound"},
          "429": {"$ref": "#/components/responses/Busy"},
          "503": {"$ref": "#/components/responses/ExecutorUnavailable"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "BearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "Cordova demo API key"}
    },
    "parameters": {
      "RequestId": {
        "name": "X-Request-ID",
        "in": "header",
        "required": false,
        "schema": {"type": "string", "format": "uuid"},
        "description": "Response-only correlation ID; callers cannot select the server request ID."
      },
      "IdempotencyKeyRejected": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "schema": {"type": "string", "maxLength": 128},
        "description": "Accepted syntactically for SDK compatibility but rejected with 400 until persistent idempotency storage is implemented."
      }
    },
    "headers": {
      "RequestId": {"description": "UUIDv4 generated by the gateway.", "schema": {"type": "string", "format": "uuid"}}
    },
    "responses": {
      "InvalidRequest": {
        "description": "Malformed or unsupported request.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      },
      "Unauthorized": {
        "description": "Missing or invalid API key.",
        "headers": {"WWW-Authenticate": {"schema": {"type": "string", "const": "Bearer"}}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      },
      "ModelNotFound": {
        "description": "The requested model is not in the catalog.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      },
      "Busy": {
        "description": "All mock executor slots are occupied.",
        "headers": {"Retry-After": {"schema": {"type": "integer", "minimum": 1}}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      },
      "ExecutorUnavailable": {
        "description": "The mock executor failed or exceeded its deadline.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "required": ["status", "stage", "mode"],
        "properties": {
          "status": {"type": "string", "const": "ok"},
          "stage": {"type": "string", "const": "1"},
          "mode": {"type": "string", "const": "mock"}
        },
        "additionalProperties": false
      },
      "Message": {
        "type": "object",
        "required": ["role", "content"],
        "properties": {
          "role": {"type": "string", "enum": ["system", "user", "assistant"]},
          "content": {"type": "string", "maxLength": 262144, "x-max-utf8-bytes": 262144}
        },
        "additionalProperties": false
      },
      "StreamOptions": {
        "type": "object",
        "required": ["include_usage"],
        "properties": {"include_usage": {"type": "boolean"}},
        "additionalProperties": false
      },
      "ChatCompletionRequest": {
        "type": "object",
        "required": ["model", "messages"],
        "properties": {
          "model": {"type": "string", "minLength": 1},
          "messages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 128,
            "items": {"$ref": "#/components/schemas/Message"},
            "contains": {"type": "object", "required": ["role"], "properties": {"role": {"const": "user"}}},
            "minContains": 1
          },
          "max_tokens": {"type": "integer", "minimum": 1, "maximum": 2048, "default": 512},
          "stream": {"type": "boolean", "default": false},
          "stream_options": {"$ref": "#/components/schemas/StreamOptions"},
          "temperature": {"type": "number", "minimum": 0, "maximum": 2, "default": 0.7},
          "top_p": {"type": "number", "exclusiveMinimum": 0, "maximum": 1, "default": 0.95},
          "stop": {
            "oneOf": [
              {"type": "string", "maxLength": 128},
              {"type": "array", "maxItems": 4, "items": {"type": "string", "maxLength": 128}}
            ]
          },
          "seed": {"type": "integer", "minimum": 0, "maximum": 2147483647},
          "n": {"type": "integer", "const": 1, "default": 1},
          "user": {"type": "string", "description": "Accepted for client compatibility, then discarded by the gateway."}
        },
        "allOf": [
          {"if": {"required": ["stream_options"]}, "then": {"properties": {"stream": {"const": true}}}}
        ],
        "additionalProperties": false,
        "x-stage-2-expansion": "Implements validation and provider forwarding for PLAN.md C2 generation controls. Context-window enforcement, real tokenization and actual sampling remain unavailable until the tokenizer and model path are admitted."
      },
      "Usage": {
        "type": "object",
        "required": ["prompt_tokens", "completion_tokens", "total_tokens"],
        "properties": {
          "prompt_tokens": {"type": "integer", "minimum": 0},
          "completion_tokens": {"type": "integer", "minimum": 0},
          "total_tokens": {"type": "integer", "minimum": 0}
        },
        "additionalProperties": false,
        "description": "Synthetic word counts in stage 1; not tokenizer output or billable usage."
      },
      "ChatCompletion": {
        "type": "object",
        "required": ["id", "object", "created", "model", "choices", "usage"],
        "properties": {
          "id": {"type": "string", "pattern": "^chatcmpl-[0-9a-f-]{36}$"},
          "object": {"type": "string", "const": "chat.completion"},
          "created": {"type": "integer", "minimum": 0},
          "model": {"type": "string"},
          "choices": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1,
            "items": {
              "type": "object",
              "required": ["index", "message", "finish_reason"],
              "properties": {
                "index": {"type": "integer", "const": 0},
                "message": {"$ref": "#/components/schemas/AssistantMessage"},
                "finish_reason": {"type": "string", "enum": ["stop", "length"]}
              },
              "additionalProperties": false
            }
          },
          "usage": {"$ref": "#/components/schemas/Usage"}
        },
        "additionalProperties": false
      },
      "AssistantMessage": {
        "type": "object",
        "required": ["role", "content"],
        "properties": {"role": {"type": "string", "const": "assistant"}, "content": {"type": "string"}},
        "additionalProperties": false
      },
      "Model": {
        "type": "object",
        "required": ["id", "object", "created", "owned_by", "context_tokens", "max_output_tokens", "availability", "input_rate_piconero_per_million", "output_rate_piconero_per_million", "owner_share_bps", "price_version"],
        "properties": {
          "id": {"type": "string", "const": "cordova-chat-small-v1"},
          "object": {"type": "string", "const": "model"},
          "created": {"type": "integer", "const": 0},
          "owned_by": {"type": "string", "const": "cordova"},
          "context_tokens": {"type": "integer", "minimum": 1},
          "max_output_tokens": {"type": "integer", "minimum": 1},
          "availability": {"type": "string", "const": "ready", "description": "Ready means the in-process mock is available, not a real model."},
          "input_rate_piconero_per_million": {"type": "string", "const": "0"},
          "output_rate_piconero_per_million": {"type": "string", "const": "0"},
          "owner_share_bps": {"type": "integer", "const": 0},
          "price_version": {"type": "string", "format": "uuid"}
        },
        "additionalProperties": false
      },
      "ModelList": {
        "type": "object",
        "required": ["object", "data"],
        "properties": {"object": {"type": "string", "const": "list"}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/Model"}}},
        "additionalProperties": false
      },
      "ErrorResponse": {
        "type": "object",
        "required": ["error", "request_id"],
        "properties": {
          "error": {
            "type": "object",
            "required": ["message", "type", "param", "code"],
            "properties": {
              "message": {"type": "string"},
              "type": {"type": "string", "enum": ["invalid_request_error", "authentication_error", "rate_limit_error", "server_error"]},
              "param": {"type": ["string", "null"]},
              "code": {"type": "string"}
            },
            "additionalProperties": false
          },
          "request_id": {"type": "string", "format": "uuid"}
        },
        "additionalProperties": false
      }
    }
  }
}
