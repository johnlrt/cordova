  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Cordova demo API key"
      },
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-cordova_session"
      }
    },
    "parameters": {
      "RequestId": {
        "name": "X-Request-ID",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "description": "Response-only correlation ID; callers cannot select the server request ID."
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "description": "Optional API-key scoped request identity. Reuse never replays retained response content."
      }
    },
    "headers": {
      "RequestId": {
        "description": "UUIDv4 generated by the gateway.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "responses": {
      "InvalidRequest": {
        "description": "Malformed or unsupported request.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Missing or invalid API key.",
        "headers": {
          "WWW-Authenticate": {
            "schema": {
              "type": "string",
              "const": "Bearer"
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ModelNotFound": {
        "description": "The requested model is not in the catalog.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Busy": {
        "description": "All mock executor slots are occupied.",
        "headers": {
          "Retry-After": {
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ExecutorUnavailable": {
        "description": "The mock executor failed or exceeded its deadline.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "required": [
          "status",
          "stage",
          "mode"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "ok"
          },
          "stage": {
            "type": "string",
            "enum": [
              "1",
              "m1"
            ]
          },
          "mode": {
            "type": "string",
            "const": "mock"
          }
        },
        "additionalProperties": false
      },
      "Message": {
        "type": "object",
        "required": [
          "role",
          "content"
        ],
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "system",
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string",
            "maxLength": 262144,
            "x-max-utf8-bytes": 262144
          }
        },
        "additionalProperties": false
      },
      "StreamOptions": {
        "type": "object",
        "required": [
          "include_usage"
        ],
        "properties": {
          "include_usage": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "ChatCompletionRequest": {
        "type": "object",
        "required": [
          "model",
          "messages"
        ],
        "properties": {
          "model": {
            "type": "string",
            "minLength": 1
          },
          "messages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 128,
            "items": {
              "$ref": "#/components/schemas/Message"
            },
            "contains": {
              "type": "object",
              "required": [
                "role"
              ],
              "properties": {
                "role": {
                  "const": "user"
                }
              }
            },
            "minContains": 1
          },
          "max_tokens": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2048,
            "default": 512
          },
          "stream": {
            "type": "boolean",
            "default": false
          },
          "stream_options": {
            "$ref": "#/components/schemas/StreamOptions"
          },
          "temperature": {
            "type": "number",
            "minimum": 0,
            "maximum": 2,
            "default": 0.7
          },
          "top_p": {
            "type": "number",
            "exclusiveMinimum": 0,
            "maximum": 1,
            "default": 0.95
          },
          "stop": {
            "oneOf": [
              {
                "type": "string",
                "maxLength": 128
              },
              {
                "type": "array",
                "maxItems": 4,
                "items": {
                  "type": "string",
                  "maxLength": 128
                }
              }
            ]
          },
          "seed": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          },
          "n": {
            "type": "integer",
            "const": 1,
            "default": 1
          },
          "user": {
            "type": "string",
            "description": "Accepted for client compatibility, then discarded by the gateway."
          }
        },
        "allOf": [
          {
            "if": {
              "required": [
                "stream_options"
              ]
            },
            "then": {
              "properties": {
                "stream": {
                  "const": true
                }
              }
            }
          }
        ],
        "additionalProperties": false,
        "x-stage-2-expansion": "Implements validation and provider forwarding for PLAN.md C2 generation controls. Context-window enforcement, real tokenization and actual sampling remain unavailable until the tokenizer and model path are admitted."
      },
      "Usage": {
        "type": "object",
        "required": [
          "prompt_tokens",
          "completion_tokens",
          "total_tokens"
        ],
        "properties": {
          "prompt_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "completion_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "total_tokens": {
            "type": "integer",
            "minimum": 0
          }
        },
        "additionalProperties": false,
        "description": "Synthetic word counts in stage 1; not tokenizer output or billable usage."
      },
      "ChatCompletion": {
        "type": "object",
        "required": [
          "id",
          "object",
          "created",
          "model",
          "choices",
          "usage"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^chatcmpl-[0-9a-f-]{36}$"
          },
          "object": {
            "type": "string",
            "const": "chat.completion"
          },
          "created": {
            "type": "integer",
            "minimum": 0
          },
          "model": {
            "type": "string"
          },
          "choices": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1,
            "items": {
              "type": "object",
              "required": [
                "index",
                "message",
                "finish_reason"
              ],
              "properties": {
                "index": {
                  "type": "integer",
                  "const": 0
                },
                "message": {
                  "$ref": "#/components/schemas/AssistantMessage"
                },
                "finish_reason": {
                  "type": "string",
                  "enum": [
                    "stop",
                    "length"
                  ]
                }
              },
              "additionalProperties": false
            }
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          }
        },
        "additionalProperties": false
      },
      "AssistantMessage": {
        "type": "object",
        "required": [
          "role",
          "content"
        ],
        "properties": {
          "role": {
            "type": "string",
            "const": "assistant"
          },
          "content": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "Model": {
        "type": "object",
        "required": [
          "id",
          "object",
          "created",
          "owned_by",
          "context_tokens",
          "max_output_tokens",
          "availability",
          "input_rate_piconero_per_million",
          "output_rate_piconero_per_million",
          "owner_share_bps",
          "price_version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "const": "cordova-chat-small-v1"
          },
          "object": {
            "type": "string",
            "const": "model"
          },
          "created": {
            "type": "integer",
            "const": 0
          },
          "owned_by": {
            "type": "string",
            "const": "cordova"
          },
          "context_tokens": {
            "type": "integer",
            "minimum": 1
          },
          "max_output_tokens": {
            "type": "integer",
            "minimum": 1
          },
          "availability": {
            "type": "string",
            "const": "ready",
            "description": "Ready means the in-process mock is available, not a real model."
          },
          "input_rate_piconero_per_million": {
            "type": "string",
            "const": "0"
          },
          "output_rate_piconero_per_million": {
            "type": "string",
            "const": "0"
          },
          "owner_share_bps": {
            "type": "integer",
            "const": 0
          },
          "price_version": {
            "type": "string",
            "format": "uuid"
          }
        },
        "additionalProperties": false
      },
      "ModelList": {
        "type": "object",
        "required": [
          "object",
          "data"
        ],
        "properties": {
          "object": {
            "type": "string",
            "const": "list"
          },
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Model"
            }
          }
        },
        "additionalProperties": false
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "message",
              "type",
              "param",
              "code"
            ],
            "properties": {
              "message": {
                "type": "string"
              },
              "type": {
                "type": "string",
                "enum": [
                  "invalid_request_error",
                  "authentication_error",
                  "rate_limit_error",
                  "server_error"
                ]
              },
              "param": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "code": {
                "type": "string"
              }
            },
            "additionalProperties": false
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "original_request_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "additionalProperties": false
      },
      "Account": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "username",
          "created_at",
          "totp_enabled",
          "privacy_notice_version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "totp_enabled": {
            "type": "boolean"
          },
          "privacy_notice_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          }
        }
      },
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password",
          "privacy_notice_version"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 128,
            "x-max-utf8-bytes": 512
          },
          "privacy_notice_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "totp_code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        }
      },
      "RecoverRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "recovery_code",
          "new_password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "recovery_code": {
            "type": "string",
            "pattern": "^crv_[0-9a-f]{32}$"
          },
          "new_password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 128,
            "x-max-utf8-bytes": 512
          }
        }
      },
      "SessionResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "account",
          "csrf_token",
          "expires_at"
        ],
        "properties": {
          "account": {
            "$ref": "#/components/schemas/Account"
          },
          "csrf_token": {
            "type": "string",
            "minLength": 32
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "recovery_codes": {
            "type": "array",
            "minItems": 8,
            "maxItems": 8,
            "items": {
              "type": "string",
              "pattern": "^crv_[0-9a-f]{32}$"
            }
          }
        }
      },
      "APIKeyCreateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "permissions",
          "model_ids",
          "daily_spend_cap_piconero"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "permissions": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "chat:write",
                "models:read",
                "usage:read"
              ]
            }
          },
          "model_ids": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "cordova-chat-small-v1"
              ]
            }
          },
          "daily_spend_cap_piconero": {
            "$ref": "#/components/schemas/Piconero"
          }
        }
      },
      "Piconero": {
        "type": "string",
        "maxLength": 19,
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Canonical decimal piconero string, bounded by the server integer range."
      },
      "Balance": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "available_piconero",
          "reserved_piconero",
          "earnings_pending_piconero",
          "earnings_available_piconero",
          "payout_reserved_piconero",
          "currency",
          "updated_at"
        ],
        "properties": {
          "available_piconero": { "$ref": "#/components/schemas/Piconero" },
          "reserved_piconero": { "$ref": "#/components/schemas/Piconero" },
          "earnings_pending_piconero": { "$ref": "#/components/schemas/Piconero" },
          "earnings_available_piconero": { "$ref": "#/components/schemas/Piconero" },
          "payout_reserved_piconero": { "$ref": "#/components/schemas/Piconero" },
          "currency": { "const": "XMR", "type": "string" },
          "updated_at": { "type": "string", "format": "date-time" }
        }
      },
      "RequestStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "request_id",
          "model_id",
          "status",
          "input_tokens",
          "output_tokens",
          "charged_piconero",
          "latency_ms",
          "created_at",
          "finished_at"
        ],
        "properties": {
          "request_id": { "type": "string", "format": "uuid" },
          "model_id": { "type": "string", "const": "cordova-chat-small-v1" },
          "status": {
            "type": "string",
            "enum": ["accepted", "running", "settled", "refunded", "cancelled", "recovering"]
          },
          "input_tokens": { "type": "integer", "minimum": 0 },
          "output_tokens": { "type": "integer", "minimum": 0 },
          "charged_piconero": {
            "anyOf": [
              { "$ref": "#/components/schemas/Piconero" },
              { "type": "null" }
            ],
            "description": "Null only while ledger recovery prevents a reliable charge result."
          },
          "latency_ms": { "type": ["integer", "null"], "minimum": 0 },
          "created_at": { "type": "string", "format": "date-time" },
          "finished_at": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "APIKey": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "account_id",
          "name",
          "prefix",
          "permissions",
          "model_ids",
          "daily_spend_cap_piconero",
          "created_at",
          "last_used_at",
          "revoked_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "maxLength": 64
          },
          "prefix": {
            "type": "string"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "chat:write",
                "models:read",
                "usage:read"
              ]
            }
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "daily_spend_cap_piconero": {
            "$ref": "#/components/schemas/Piconero"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_used_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "revoked_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "APIKeyCreateResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "key",
          "secret"
        ],
        "properties": {
          "key": {
            "$ref": "#/components/schemas/APIKey"
          },
          "secret": {
            "type": "string",
            "pattern": "^cvk_[0-9a-f]{64}$",
            "description": "Shown once at creation; store securely."
          }
        }
      },
      "APIKeyList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "data",
          "next_cursor"
        ],
        "properties": {
          "data": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "$ref": "#/components/schemas/APIKey"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        }
      },
      "UsageRow": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "request_id",
          "api_key_id",
          "model_id",
          "status",
          "input_tokens",
          "output_tokens",
          "charged_piconero",
          "latency_ms",
          "created_at",
          "finished_at"
        ],
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "api_key_id": {
            "type": "string",
            "format": "uuid",
            "description": "Credential identity for key-scoped usage queries."
          },
          "model_id": {
            "type": "string",
            "const": "cordova-chat-small-v1"
          },
          "status": {
            "type": "string",
            "enum": ["accepted", "running", "settled", "refunded", "cancelled", "recovering", "completed"]
          },
          "input_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "output_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "charged_piconero": {
            "$ref": "#/components/schemas/Piconero"
          },
          "latency_ms": {
            "type": "integer",
            "minimum": 0
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "UsageList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "data",
          "next_cursor"
        ],
        "properties": {
          "data": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/UsageRow"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        }
      },
      "LiveTicketResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "ticket",
          "expires_at"
        ],
        "properties": {
          "ticket": {
            "type": "string",
            "minLength": 32,
            "maxLength": 128
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    }
  }
}
