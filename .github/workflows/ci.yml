name: Cordova checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/gateway ./cmd/mock-node
      - name: Dependency vulnerability check
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            status=0
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... >"$log_file" 2>&1 || status=$?
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -Eqi 'operation timed out|i/o timeout|context deadline exceeded|connection reset|network is unreachable|dial tcp|temporary failure in name resolution' "$log_file"; then
              rm -f "$log_file"
              sleep 5
              continue
            fi
            rm -f "$log_file"
            exit "$status"
          done
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check REST, WebSocket, tokenizer schemas and fixtures
        run: sh scripts/contracts-check.sh
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test the Rust node CLI and protocol
        run: cargo test --locked --workspace
      - name: Lint the Rust node
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: python ../scripts/contracts-check.py
      - run: npm run check
      - run: npm run check:browser
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - name: Dependency vulnerability check
        run: npm audit --audit-level=high
  frontend-m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare isolated M1 stack
        run: |
          make bootstrap-dev
          make config-check
          # The generated files stay inside a mode-700 directory; make mounted test secrets readable by UID 10001.
          chmod 0644 .local/*
          docker compose -f infra/compose.yaml -f infra/compose.dev.yaml up --build --wait || {
            docker compose -f infra/compose.yaml -f infra/compose.dev.yaml ps --all
            for service_name in edge redpanda; do
              service_container_id="$(docker compose -f infra/compose.yaml -f infra/compose.dev.yaml ps -q "$service_name")"
              if [ -n "$service_container_id" ]; then
                docker inspect --format "$service_name: {{json .State.Health}}" "$service_container_id" || true
              fi
            done
            docker compose -f infra/compose.yaml -f infra/compose.dev.yaml logs --no-color edge redis redpanda
            exit 1
          }
          curl --fail --insecure --silent --show-error --max-time 5 https://127.0.0.1:8443/healthz || {
            docker compose -f infra/compose.yaml -f infra/compose.dev.yaml ps --all
            docker compose -f infra/compose.yaml -f infra/compose.dev.yaml logs --no-color edge
            exit 1
          }
      - name: Verify frontend auth and live usage through nginx
        working-directory: frontend
        env:
          CORDOVA_M1_ORIGIN: https://localhost:8443
        run: npm run test:m1
      - name: Capture safe gateway diagnostics after M1 failure
        if: failure()
        run: docker compose -f infra/compose.yaml -f infra/compose.dev.yaml logs --no-color gateway
      - name: Capture safe usage pipeline counters after M1 failure
        if: failure()
        run: |
          docker compose -f infra/compose.yaml -f infra/compose.dev.yaml exec -T redis sh -c '
            export REDISCLI_AUTH="$(cat /run/secrets/redis_password)"
            printf "usage_outbox_length="
            redis-cli --raw XLEN cv:v1:outbox:usage
            printf "usage_recovery_pending="
            redis-cli --raw SCARD cv:v1:usage:pending
            redis-cli --raw --scan --pattern "cv:v1:account-usage:*" | while IFS= read -r key; do
              printf "account_usage_rows="
              redis-cli --raw XLEN "$key"
            done
            redis-cli --raw --scan --pattern "cv:v1:key-usage:*" | while IFS= read -r key; do
              printf "key_usage_rows="
              redis-cli --raw XLEN "$key"
            done
          '
          docker compose -f infra/compose.yaml -f infra/compose.dev.yaml exec -T redpanda rpk topic describe cordova.account.usage.v1 --brokers redpanda:9092 || true
          docker compose -f infra/compose.yaml -f infra/compose.dev.yaml exec -T redpanda rpk group describe cordova-usage-projection-v1 --brokers redpanda:9092 || true
      - name: Verify M1 request and edge acceptance flows
        run: |
          make smoke
          make test-edge
      - name: Stop CI stack
        if: always()
        run: docker compose -f infra/compose.yaml -f infra/compose.dev.yaml down
